name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Nix
      uses: cachix/install-nix-action@v27
      with:
        extra_nix_config: |
          experimental-features = nix-command flakes

    - name: Build and test
      # -L prints full build logs. Without it nix truncates a failing build to
      # its last 25 lines, which hides the first compiler error -- the only one
      # that usually matters.
      run: nix build -L

    - name: Concurrency tests under ThreadSanitizer
      # TSan from GCC 14 cannot map its shadow memory with the 32 bits of mmap
      # randomisation newer kernels default to; 28 is what it supports.
      run: |
        sudo sysctl -w vm.mmap_rnd_bits=28
        nix build -L .#checks.x86_64-linux.thread-sanitizer
